[project]
name = "jobq"
version = "1.0.0"
description = "Distributed task scheduler and job queue: FastAPI, PostgreSQL and Redis Streams with leases, fencing, retries and a dead-letter queue."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Anurag Bhandary" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.scripts]
jobq = "jobq.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "asgi-lifespan>=2.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
markers = ["chaos: multi-process crash-recovery tests (spawn and kill real worker processes)"]
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]

[tool.coverage.run]
source = ["jobq"]
omit = ["*/jobq/__main__.py"]
branch = true
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["B008", "RUF012", "UP040", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC109"]

[tool.mypy]
python_version = "3.12"
packages = ["jobq"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "prometheus_client.*"]
ignore_missing_imports = true
